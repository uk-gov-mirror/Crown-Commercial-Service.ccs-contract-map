# DVC Pipeline Parameters for Contract Mapping

# Data Processing
data:
  input_excel: "data/input/evaluation_dataset.xlsx"
  train_tsv: "data/input/evaluation_dataset_train.tsv"
  test_tsv: "data/input/evaluation_dataset_test.tsv"
  train_split_ratio: 0.8
  semantic_anchors_json: "semantic_anchors.json"
  RMnumber_framework_mapping: "data/input/GCA_RMnumber_framework_mapping.csv"

# Grid Search Parameters
gridsearch:
  thresholds: [1, 2, 3, 5, 10, 25, 50]
  margins: [1, 5, 10]

# MLflow Configuration
mlflow:
  experiment_name: "ContractMap-Evaluation"

# Evaluation Settings
evaluation:
  prompt_name: "system_prompt_v2.md"

# Output Paths
outputs:
  results_dir: "data/results"
  completion_marker: "data/results/optimization_complete.txt"
  plot_output: "data/results/optimization_surface.png"